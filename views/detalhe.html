<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Chamado — TVF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../chamados/style.css" />
    <link rel="stylesheet" href="acompanhamento.css" />
  </head>
  <body>
    <div class="support-page">
      <div class="support-page__background" aria-hidden="true">
        <div class="support-page__bg-gradient"></div>
        <div class="support-page__bg-grid"></div>
        <div class="support-page__bg-glow support-page__bg-glow--left"></div>
        <div class="support-page__bg-glow support-page__bg-glow--right"></div>
        <canvas id="network-canvas" class="support-page__canvas"></canvas>
      </div>

      <main class="support-shell support-shell--wide">
        <header class="track-topbar">
          <div class="brand">
            <img src="../assets/logo.png" alt="TVF Soluções em TI" class="brand__logo" />
          </div>
          <div class="track-topbar__contacts">
            <a href="chamados.html">← Voltar para chamados</a>
          </div>
        </header>

        <section class="ticket-panel ticket-detail" id="ticket-detail">
          <p class="form-feedback" id="detail-feedback" role="alert" aria-live="polite" hidden></p>

          <div id="ticket-detail-content" class="detail-grid" hidden>
            <div>
              <p class="ticket-detail__label">Nº do Chamado</p>
              <p class="ticket-id" id="detail-id">-</p>
            </div>

            <div>
              <p class="ticket-detail__label">Assunto</p>
              <p id="detail-title">-</p>
            </div>

            <div class="detail-meta-row" id="detail-badges"></div>

            <div>
              <p class="ticket-detail__label">Descrição</p>
              <p class="detail-description" id="detail-description">-</p>
            </div>

            <div>
              <p class="ticket-detail__label">Data de abertura</p>
              <p id="detail-date">-</p>
            </div>

            <section class="detail-attachments" aria-label="Anexos do chamado">
              <h3>Anexos</h3>
              <ul class="attachment-list" id="detail-attachments-list"></ul>
              <p class="attachment-empty" id="detail-attachments-empty" hidden>
                Nenhum anexo vinculado a este chamado.
              </p>
            </section>

            <section class="detail-history" aria-label="Histórico de respostas">
              <h3>Histórico de respostas</h3>
              <ul class="history-list" id="detail-history-list"></ul>
              <p class="history-empty" id="detail-history-empty" hidden>
                Nenhuma resposta registrada até o momento.
              </p>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="../assets/js/api-client.js"></script>
    <script src="../chamados/script.js"></script>
    <script src="detalhe.js"></script>
  </body>
</html>
