<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Chamado — TVF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../chamados/style.css" />
  </head>
  <body>
    <div class="support-page">
      <div class="support-page__background" aria-hidden="true">
        <div class="support-page__bg-gradient"></div>
        <div class="support-page__bg-grid"></div>
        <div class="support-page__bg-glow support-page__bg-glow--left"></div>
        <div class="support-page__bg-glow support-page__bg-glow--right"></div>
        <canvas id="network-canvas" class="support-page__canvas"></canvas>
      </div>

      <main class="support-shell">
        <header class="support-header">
          <div class="brand">
            <img src="../assets/logo.png" alt="TVF Soluções em TI" class="brand__logo" />
          </div>
          <div class="header-title">
            <h1>Detalhes do Chamado</h1>
            <p>Informações completas da solicitação</p>
          </div>
          <div class="contact">
            <a href="chamados.html">Voltar</a>
          </div>
        </header>

        <section class="ticket-panel ticket-detail" id="ticket-detail">
          <p class="form-feedback" id="detail-feedback" role="alert" aria-live="polite" hidden></p>
          <div id="ticket-detail-content" hidden>
            <p><span class="ticket-detail__label">ID</span><br /><span id="detail-id"></span></p>
            <p><span class="ticket-detail__label">Título</span><br /><span id="detail-title"></span></p>
            <p><span class="ticket-detail__label">Descrição</span><br /><span id="detail-description"></span></p>
            <p><span class="ticket-detail__label">Status</span><br /><span id="detail-status"></span></p>
            <p><span class="ticket-detail__label">Urgência</span><br /><span id="detail-urgency"></span></p>
            <p><span class="ticket-detail__label">Abertura</span><br /><span id="detail-date"></span></p>
          </div>
        </section>
      </main>
    </div>

    <script src="../assets/js/api-client.js"></script>
    <script src="../chamados/script.js"></script>
    <script src="detalhe.js"></script>
  </body>
</html>
